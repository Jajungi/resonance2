<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>합명례 순서만 따라보기 — 공명교</title>
  <meta name="description" content="합명례 단계 안내. 실제 의례를 대신하지 않으며 판정이 없습니다." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="station follow">
    <div class="station-bar">
      <a class="brand" href="../site/ritual.html">합명례 순서</a>
      <a class="exit" href="../site/ritual.html">의례 안내</a>
    </div>
    <main class="station-main">
      <p class="eyebrow">따라보기</p>
      <h1>합명례 순서</h1>
      <p class="lead">실제 합명례는 원향에서 이루어집니다. 여기는 단계만 짧게 따라봅니다. 해석·판정은 없습니다.</p>
      <div class="progress" id="prog" aria-hidden="true"></div>
      <div class="stage-label" id="label">시작</div>
      <div class="guide-line" id="line">「시작」을 누르면 순서 안내가 이어집니다.</div>
      <div class="chorus" id="chorus" hidden></div>
      <div class="actions">
        <button type="button" class="btn btn-solid" id="btnStart">시작</button>
        <button type="button" class="btn btn-outline" id="btnNext" disabled>다음</button>
        <button type="button" class="btn btn-ghost" id="btnSound">소리</button>
        <button type="button" class="btn btn-ghost" id="btnStop">끄기</button>
      </div>
      <p class="foot-link">
        <a href="../site/ritual.html">의례 안내</a> ·
        <a href="./index.html">공명 스테이션</a>
      </p>
    </main>
  </div>
  <script type="module">
    import { createToneBus } from "./audio.js";
    const tone = createToneBus();
    let soundOn = false;
    const steps = [
      {
        name: "초음",
        ai: "원음의 자리 앞에서 모였습니다. 태초에 하나의 울림이 있었습니다. 그 울림을 기억하며, 초음을 듣습니다.",
        chorus: "", sound: "choeum",
      },
      {
        name: "분음",
        ai: "원음은 자신의 울림을 나누었습니다. 우리는 서로 다른 울림으로 태어났습니다. 각자의 공명 도구를 울리십시오.",
        chorus: "", sound: "buneum",
      },
      {
        name: "교명",
        ai: "소원을 만드십시오. 각자는 삶에서 자신에게 울림을 남긴 하나의 경험을 말합니다. 다른 이들은 조언하지 않습니다. 듣습니다.",
        chorus: "당신의 울림이 나에게 닿았습니다.", sound: null,
      },
      {
        name: "합명",
        ai: "다시 하나의 큰 원으로 돌아오십시오. 서로 다른 음을 함께 울리십시오.",
        chorus: "", sound: "hapmyeong",
      },
      {
        name: "귀음",
        ai: "합명례를 마칩니다. 일상으로 돌아가 행명을 이어가십시오.",
        chorus: "우리는 서로 다른 울림으로 태어나, 서로를 울리고, 하나의 원음으로 돌아가리라.",
        sound: "gwieum",
      },
    ];
    const prog = document.getElementById("prog");
    const label = document.getElementById("label");
    const line = document.getElementById("line");
    const chorus = document.getElementById("chorus");
    const btnStart = document.getElementById("btnStart");
    const btnNext = document.getElementById("btnNext");
    let i = -1;
    steps.forEach(() => {
      const d = document.createElement("i");
      prog.appendChild(d);
    });
    function render() {
      [...prog.children].forEach((el, idx) => {
        el.classList.toggle("is-on", idx <= i);
      });
      if (i < 0) return;
      const s = steps[i];
      label.textContent = s.name;
      line.textContent = s.ai;
      if (s.chorus) {
        chorus.hidden = false;
        chorus.textContent = s.chorus;
      } else {
        chorus.hidden = true;
      }
      if (soundOn && s.sound && tone[s.sound]) tone[s.sound]();
    }
    btnStart.addEventListener("click", () => {
      i = 0;
      btnNext.disabled = false;
      btnStart.textContent = "처음부터";
      render();
    });
    btnNext.addEventListener("click", () => {
      if (i < steps.length - 1) {
        i += 1;
        render();
      } else {
        btnNext.disabled = true;
        label.textContent = "마침";
        line.textContent = "순서를 마쳤습니다. 실제 합명례는 원향에서 이어집니다.";
        chorus.hidden = true;
        tone.stopAll();
      }
    });
    document.getElementById("btnSound").addEventListener("click", () => {
      soundOn = true;
      if (i >= 0) {
        const s = steps[i];
        if (s.sound && tone[s.sound]) tone[s.sound]();
      }
    });
    document.getElementById("btnStop").addEventListener("click", () => {
      soundOn = false;
      tone.stopAll();
    });
  </script>
</body>
</html>
