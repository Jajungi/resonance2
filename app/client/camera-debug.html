<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>공명 · 카메라 테스트</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #111;
      color: #eee;
      font-family: "Pretendard", "Noto Sans KR", sans-serif;
      overflow: hidden;
    }
    .wrap {
      display: flex;
      flex-direction: column;
      height: 100%;
      padding: 10px;
      gap: 8px;
    }
    .label {
      font-size: 12px;
      letter-spacing: 0.08em;
      color: #bbb;
    }
    .frame {
      position: relative;
      flex: 1;
      min-height: 0;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      border: 1px solid rgba(255,255,255,0.15);
    }
    video, canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    video { transform: scaleX(-1); }
    canvas { pointer-events: none; }
    .hint {
      font-size: 11px;
      color: #888;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <p class="label">테스트 · 카메라 인식</p>
    <div class="frame">
      <video id="debugVideo" playsinline muted autoplay></video>
      <canvas id="debugOverlay"></canvas>
    </div>
    <p class="hint">주황: 골격 · 파란 원: 입자가 모이는 곳</p>
  </div>
</body>
</html>
